<header class="header">
  <div class="profile">
    <div class="avatar">
      {{ avatarInitials }}
    </div>

    <div>
      <p class="greeting">
        {{ greetingMessage }}
      </p>

      <h1 class="name">
        {{ userName }}
      </h1>
    </div>
  </div>

  <button
    class="notification-btn"
    aria-label="Notifications"
    type="button"
  >
    <span class="material-symbols-outlined">notifications</span>
  </button>
</header>
